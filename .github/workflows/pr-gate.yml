name: Regression Gate (PR Smoke)

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Candidate Run ID"
        required: false
        default: "pr_candidate"
      tolerance:
        description: "Regression tolerance for smoke subset (default: 0.15 / 15 points; 0.10 for full 15-task runs)"
        required: false
        default: "0.15"
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  regression-gate:
    # Strict security guardrail: Never expose secrets on third-party forks
    if: |
      (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gate')) &&
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PYTHONPATH: ${{ github.workspace }}/vendor/tau-bench

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout tau-bench vendor
        run: |
          git clone https://github.com/sierra-research/tau-bench.git vendor/tau-bench
          git -C vendor/tau-bench checkout 59a200c6d575d595120f1cb70fea53cef0632f6b

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv pip install --no-deps -e vendor/tau-bench

      - name: Run Stratified Smoke Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Trim whitespace and quotes from GEMINI_API_KEY at startup
          if [ -n "$GEMINI_API_KEY" ]; then
            CLEAN_KEY=$(echo "$GEMINI_API_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'"'"']//' -e 's/["'"'"']$//')
            export GEMINI_API_KEY="$CLEAN_KEY"
            echo "GEMINI_API_KEY found: true (length: ${#CLEAN_KEY})"
          else
            echo "GEMINI_API_KEY found: false (length: 0)"
            echo "❌ [ERROR] GEMINI_API_KEY secret is not set or empty in GitHub repository settings!"
            echo "Please configure GEMINI_API_KEY in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          RUN_ID="pr_${{ github.event.pull_request.number || 'manual' }}_$(date +%s)"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          export RUN_ID
          # Execute smoke benchmark subset (5 stratified tasks x k=2)
          RUN_EXIT=0
          uv run agentgate run \
            --run-id "$RUN_ID" \
            --tasks "16,0,10,17,3" \
            --trials 2 \
            --max-steps 30 \
            --model "gemini/gemini-3.1-flash-lite" \
            --prompt-version "v1" \
            --concurrency 3 || RUN_EXIT=$?

          # Validate smoke benchmark output integrity (always runs even if runner exited non-zero)
          VALIDATOR_EXIT=0
          python3 - << 'EOF' || VALIDATOR_EXIT=$?
          import os, sys, json, sqlite3
          from pathlib import Path

          run_id = os.environ.get("RUN_ID")
          if not run_id:
              print("❌ [FAIL] RUN_ID environment variable is empty or not set!")
              sys.exit(1)

          expected_trials = 10
          db_path = Path("results/agentgate.db")

          print("\n" + "="*50)
          print("SMOKE BENCHMARK INTEGRITY VALIDATION")
          print("="*50)

          if not db_path.exists():
              print(f"❌ [FAIL] Database file '{db_path}' not found!")
              sys.exit(1)

          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              cur = conn.cursor()

              cur.execute("SELECT COUNT(*) FROM trial_results WHERE run_id = ?", (run_id,))
              completed = cur.fetchone()[0]

              cur.execute("SELECT COUNT(*) FROM trial_results WHERE run_id = ? AND status = 'infra_error'", (run_id,))
              infra_errors = cur.fetchone()[0]

              cur.execute(
                  "SELECT COUNT(*) FROM trial_results WHERE run_id = ? AND success = 1 AND (status != 'infra_error' OR status IS NULL)",
                  (run_id,),
              )
              successful = cur.fetchone()[0]

              cur.execute(
                  "SELECT task_id, trial_id, error, status FROM trial_results WHERE run_id = ? AND error IS NOT NULL AND error != '' LIMIT 1",
                  (run_id,),
              )
              first_err_row = cur.fetchone()

          # Scan for authentication errors
          AUTH_KEYWORDS = ("401", "403", "api_key", "unauthorized", "permission", "authentication")
          QUOTA_KEYWORDS = ("quota", "429", "resource_exhausted")

          auth_error = None
          quota_infra_error = None

          if first_err_row:
              err_str = str(first_err_row["error"]).lower()
              if any(kw in err_str for kw in AUTH_KEYWORDS):
                  auth_error = f"Task {first_err_row['task_id']} Trial {first_err_row['trial_id']}: {first_err_row['error']}"
              if infra_errors > 0 and any(kw in err_str for kw in QUOTA_KEYWORDS):
                  quota_infra_error = f"Task {first_err_row['task_id']} Trial {first_err_row['trial_id']}: {first_err_row['error']}"

          # Check api_calls.jsonl for persistent unretried auth errors
          audit_log = Path("results/api_calls.jsonl")
          if audit_log.exists() and not auth_error:
              with open(audit_log, "r", encoding="utf-8") as f:
                  for line in f:
                      try:
                          rec = json.loads(line)
                          err_str = str(rec.get("error", "")).lower()
                          if any(kw in err_str for kw in AUTH_KEYWORDS):
                              auth_error = rec.get("error")
                              break
                      except Exception:
                          pass

          print(f"Run ID           : {run_id}")
          print(f"Trials Completed : {completed} / {expected_trials} expected")
          print(f"Successful Trials: {successful}")
          print(f"Infra Errors     : {infra_errors}")

          first_error = None
          if first_err_row:
              first_error = f"Task {first_err_row['task_id']} Trial {first_err_row['trial_id']}: {first_err_row['error']}"
          elif auth_error:
              first_error = auth_error

          if first_error:
              print(f"First Error      : {first_error}")

          failed = False
          if completed < expected_trials:
              print(f"❌ [FAIL] Fewer trials completed than scheduled: {completed} < {expected_trials}")
              failed = True

          if infra_errors > 0:
              print(f"❌ [FAIL] Benchmark had {infra_errors} infrastructure error(s)!")
              if quota_infra_error:
                  print(f"❌ [FAIL] Quota exhaustion caused trial failure: {quota_infra_error}")
              failed = True

          if auth_error:
              print(f"❌ [FAIL] Authentication failure detected: {auth_error}")
              failed = True

          print("="*50)
          if failed:
              sys.exit(1)
          print("✅ [PASS] Smoke benchmark completed all expected trials without infra/auth errors.")
          EOF

          if [ $RUN_EXIT -ne 0 ] || [ $VALIDATOR_EXIT -ne 0 ]; then
            echo "❌ [FAIL] Smoke benchmark step failed (RUN_EXIT=$RUN_EXIT, VALIDATOR_EXIT=$VALIDATOR_EXIT)."
            exit 1
          fi

      - name: Evaluate Regression Gate
        id: gate_step
        run: |
          mkdir -p results
          # Run gate comparison against committed reference baseline JSON.
          # Smoke subset uses 0.15 tolerance (single-trial drop = 10 pts; catches drops >= 20 pts).
          # Full 15-task benchmark uses 0.10 tolerance.
          # Optional Retry Rule: If the smoke gate fails on the tolerance rule, re-run the smoke subset once
          # and fail only if both runs fail.
          GATE_EXIT=0
          uv run agentgate gate \
            --baseline "baselines/baseline_v1_steps30.json" \
            --candidate "$RUN_ID" \
            --tolerance "${{ github.event.inputs.tolerance || '0.15' }}" > gate_output.txt 2>&1 || GATE_EXIT=$?
          echo "gate_exit=$GATE_EXIT" >> $GITHUB_OUTPUT
          cat gate_output.txt
          exit $GATE_EXIT

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No output captured.';
            if (fs.existsSync('gate_output.txt')) {
              output = fs.readFileSync('gate_output.txt', 'utf8');
            }
            const gatePassed = '${{ steps.gate_step.outputs.gate_exit }}' === '0';
            const statusEmoji = gatePassed ? '✅' : '❌';
            const statusText = gatePassed ? 'Regression Gate Passed' : 'Regression Gate Failed';
            
            const runId = process.env.RUN_ID || 'smoke_candidate';
            const body = `### ${statusEmoji} AgentGate: ${statusText}\n\n` +
                         `Evaluated candidate **\`${runId}\`** against canonical baseline **\`baseline_v1_steps30\`**:\n\n` +
                         `\`\`\`text\n${output}\n\`\`\``;
            
            const issueNumber = context.issue?.number || (context.payload?.pull_request?.number);
            if (issueNumber) {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log("No pull request issue number found; skipping comment posting. Comment body:\n" + body);
            }
